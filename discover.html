<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Community Hub</title>
  <link rel="stylesheet" href="./css/styles.css" />
</head>

<body>
  <div class="bg-layer" aria-hidden="true"></div>
  <!-- Cool Little Dynamic Cursor Effect -->
  <div id="cursor-light"></div>

  <!-- Page -->
  <header class="topbar">
    <div class="topbar-inner">

      <!-- LOGO (clickable home link) -->
      <a href="index.html" class="brand" aria-label="Go to home">
        <div class="brand-mark" aria-hidden="true">⌂</div>
        <div>
          <div class="brand-title">Community Hub</div>
          <div class="brand-subtitle">Find local links quickly</div>
        </div>
      </a>

      <!-- Search -->
      <div class="search-wrap search-shell">
        <label class="sr-only" for="searchInput">Search links</label>
        <input id="searchInput" class="input site-search" type="search"
          placeholder="Search: orthopedics, restaurants, tutoring, utilities..." autocomplete="off" />
        <div id="searchSuggestions" class="search-suggestions" hidden></div>
      </div>

      <!-- Primary Navigation -->
      <nav class="primary-nav" aria-label="Primary">
        <a href="index.html" class="btn">Home</a>
        <a href="discover.html" class="btn is-active" aria-current="page">Discover</a>
        <a href="about.html" class="btn">About Us</a>
        <a href="contact.html" class="btn">Contact</a>
        <a href="contribute.html" class="btn">Contribute</a>
      </nav>
      <div class="theme-toggle-wrap">
        <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle theme">
          <span class="theme-toggle-track">
            <span class="theme-toggle-thumb"></span>
          </span>
          <span class="theme-toggle-label">Light</span>
        </button>
      </div>

    </div>

  </header>

  <main class="container">
    <section class="section">
      <h2 class="section-title">Quick Index</h2>
      <p class="section-subtitle">Browse by category or search. Click a card to open the site.</p>
      <div class="tagbar">

        <!-- Little "Tagbar" to enable faster searching -->
        <div class="tagbar-title">Filter by tag:</div>
        <div id="tagBar" class="tagbar-chips" aria-label="Tag filters"></div>
      </div>
      <div id="resultsMeta" class="results-meta" aria-live="polite"></div>
      <div id="linksGrid" class="grid" aria-label="Link results"></div>

    </section>


    <!-- template! MORE MODALS!!!-->
    <div id="placePreviewModal" class="modal" hidden>
      <div class="modal-backdrop" data-close-modal></div>
      <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <button class="modal-close" id="modalCloseBtn" type="button" aria-label="Close">×</button>

        <div class="modal-body">
          <h2 id="modalTitle" class="modal-title"></h2>
          <p id="modalShortDescription" class="modal-desc"></p>

          <div class="modal-section">
            <h3>Tags</h3>
            <div id="modalTags" class="card-tags"></div>
          </div>

          <div class="modal-section">
            <h3>Rating</h3>
            <p id="modalRating" class="modal-meta"></p>
          </div>

          <div class="modal-section">
            <h3>Hours</h3>
            <div id="modalHours" class="hours-list"></div>
          </div>

          <div class="modal-actions">
            <a id="modalPlaceLink" class="btn btn-primary" href="#">Open Place Page</a>
            <a id="modalWebsiteLink" class="btn" href="#" target="_blank" rel="noopener">Visit Website</a>
          </div>
        </div>
      </div>
    </div>

    <footer class="footer">
        <div class="footer-inner">
            <a href="./Copyright.pdf" class="footer-link">Copyright Checklist</a>
            <a href="https://github.com/JoeMusashi9999/TSA-webapp" class="footer-link">Source Code</a>
            <a href="./Planofwork.pdf" class="footer-link">Plan of Work</a>
        </div>
    </footer>
    <div id="themeTransition" class="theme-transition" aria-hidden="true"></div>
    <script src="./javascript/theme.js"></script>
    <script src="./javascript/directory.js"></script>
    <script src="./javascript/dynamicCursor.js"></script>

</body>

</html>
